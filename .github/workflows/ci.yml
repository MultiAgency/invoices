name: Invoices frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - run: npm install -g pnpm@12.14.0
      # The vendored tarball is the default dependency, so this installs exactly the lockfile. A commit that links a local
      # SDK checkout (an opt-in development state) has no checkout here, so it is tested against the vendored tarball
      # instead; that build is never uploaded.
      - id: sdk
        run: |
          if node scripts/release-mode.mjs; then
            echo "mode=release" >> "$GITHUB_OUTPUT"; pnpm install --frozen-lockfile
          else
            echo "mode=dev" >> "$GITHUB_OUTPUT"; node scripts/release-mode.mjs --use-vendored && pnpm install --no-frozen-lockfile
          fi
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: .test-artifacts/browser-failures/
      - if: steps.sdk.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: invoices-frontend
          path: dist/
  # A fresh clone with only Node and pnpm: the first steps of the README, exactly as written, with nothing carried over.
  clean-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - run: npm install -g pnpm@12.14.0
      - run: test ! -e node_modules && test ! -e dist
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
