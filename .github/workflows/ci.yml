name: Invoices frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - run: npm install -g pnpm@12.14.0
      # CI passes only on release-candidate commits; a dev commit links Proto's SDK checkout, which isn't here.
      - run: node scripts/release-mode.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: .test-artifacts/browser-failures/
      - uses: actions/upload-artifact@v4
        with:
          name: invoices-frontend
          path: dist/
