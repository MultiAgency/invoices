name: Invoices frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - run: npm install -g pnpm@12.14.0
      # A release candidate installs exactly its lockfile. A development commit links Proto's SDK checkout, which
      # isn't here, so this run tests it against the vendored tarball instead; that build is never uploaded.
      - id: sdk
        run: |
          if node scripts/release-mode.mjs; then
            echo "mode=release" >> "$GITHUB_OUTPUT"; pnpm install --frozen-lockfile
          else
            echo "mode=dev" >> "$GITHUB_OUTPUT"; node scripts/release-mode.mjs --use-vendored && pnpm install --no-frozen-lockfile
          fi
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: .test-artifacts/browser-failures/
      - if: steps.sdk.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: invoices-frontend
          path: dist/
